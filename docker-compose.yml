services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: controle_atestados
      POSTGRES_USER: controle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controle -d controle_atestados"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgres://controle:${POSTGRES_PASSWORD}@db:5432/controle_atestados
      APP_PUBLIC_ORIGIN: ${APP_PUBLIC_ORIGIN:-}
      RUN_MIGRATIONS: "true"
      NEXTI_CLIENT_ID: ${NEXTI_CLIENT_ID:?configure NEXTI_CLIENT_ID no .env}
      NEXTI_CLIENT_SECRET: ${NEXTI_CLIENT_SECRET:?configure NEXTI_CLIENT_SECRET no .env}
      NEXTI_API_BASE_URL: ${NEXTI_API_BASE_URL:-https://api.nexti.com}
      NEXTI_TOKEN_URL: ${NEXTI_TOKEN_URL:-https://api.nexti.com/security/oauth/token}
      NEXTI_AUTO_SYNC_ENABLED: ${NEXTI_AUTO_SYNC_ENABLED:-true}
      NEXTI_SYNC_POLL_SECONDS: ${NEXTI_SYNC_POLL_SECONDS:-60}
      NEXTI_SYNC_INITIAL_LOOKBACK_DAYS: ${NEXTI_SYNC_INITIAL_LOOKBACK_DAYS:-365}
      NEXTI_SYNC_OVERLAP_MINUTES: ${NEXTI_SYNC_OVERLAP_MINUTES:-15}
      NEXTI_SYNC_MIN_INTERVAL_SECONDS: ${NEXTI_SYNC_MIN_INTERVAL_SECONDS:-60}
      NEXTI_MEDICAL_ABSENCE_SITUATION_IDS: ${NEXTI_MEDICAL_ABSENCE_SITUATION_IDS:-}
      NEXTI_MEDICAL_ABSENCE_SITUATION_EXTERNAL_IDS: ${NEXTI_MEDICAL_ABSENCE_SITUATION_EXTERNAL_IDS:-}
      NEXTI_USER_ACCOUNT_LOOKBACK_START: ${NEXTI_USER_ACCOUNT_LOOKBACK_START:-01012000}
      NEXTI_OPERATOR_NAME_OVERRIDES: ${NEXTI_OPERATOR_NAME_OVERRIDES:-}
      NOTIFICATION_SITE_URL: ${NOTIFICATION_SITE_URL:-https://nextibombeiros-bit.github.io/CONTROLE-DE-ATESTADOS/}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-5}
    expose:
      - "3000"
    labels:
      traefik.enable: "true"
      traefik.http.routers.controle-atestados.rule: "Host(`${APP_DOMAIN}`)"
      traefik.http.routers.controle-atestados.entrypoints: "websecure"
      traefik.http.routers.controle-atestados.tls.certresolver: "letsencrypt"
      traefik.http.services.controle-atestados.loadbalancer.server.port: "3000"

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      GENERIC_TIMEZONE: America/Sao_Paulo
      N8N_HOST: ${APP_DOMAIN}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_PATH: /n8n/
      N8N_EDITOR_BASE_URL: https://${APP_DOMAIN}/n8n/
      WEBHOOK_URL: https://${APP_DOMAIN}/n8n/
      N8N_PROXY_HOPS: 1
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?configure N8N_ENCRYPTION_KEY no .env}
      N8N_ENABLED_MODULES: data-table
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      CONTROLE_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
    volumes:
      - n8n_data:/home/node/.n8n
    expose:
      - "5678"
    labels:
      traefik.enable: "true"
      traefik.http.routers.n8n.rule: "Host(`${APP_DOMAIN}`) && PathPrefix(`/n8n`)"
      traefik.http.routers.n8n.entrypoints: "websecure"
      traefik.http.routers.n8n.tls.certresolver: "letsencrypt"
      traefik.http.routers.n8n.middlewares: "n8n-strip-prefix"
      traefik.http.middlewares.n8n-strip-prefix.stripprefix.prefixes: "/n8n"
      traefik.http.services.n8n.loadbalancer.server.port: "5678"

  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?configure APP_DOMAIN no .env}
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  n8n_data:
  caddy_data:
  caddy_config:
